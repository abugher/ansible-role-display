---
- include_tasks:        'tasks/common/user_groups.yml'
- include_tasks:        'tasks/common/users.yml'
- include_tasks:        'tasks/common/add_users_to_groups.yml'
- include_tasks:        'tasks/common/remove_packages.yml'
- include_tasks:        'tasks/common/install_packages.yml'
- include_tasks:        'tasks/common/adjust_files.yml'
- include_tasks:        'tasks/common/create_files.yml'
- include_tasks:        'tasks/common/install_files.yml'
- include_tasks:        'tasks/common/lines_in_files.yml'
- include_tasks:        'tasks/common/reboot.yml'
  when:                 user_groups_result.changed
                        or users_result.changed
                        or add_users_to_groups_result.changed
                        or remove_packages_result.changed
                        or install_packages_result.changed
                        or adjust_files_result.changed
                        or create_files_result.changed
                        or install_files_result.changed
                        or lines_in_files_result.changed
